services:
  wayfarer:
    build: ./wayfarer
    image: wayfarer:local
    container_name: wayfarer
    ports:
      - "4747:4747"
    environment:
      PORT: 4747
    volumes:
      # The published photo set, mounted read-only — the viewer can't edit it.
      - ./wayfarer/images:/app/images:ro
    # Stateless: photos are read from the mounted folder, nothing is written.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4747/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
